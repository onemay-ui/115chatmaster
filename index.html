        const useTTS = () => {
            const speak = (text, lang = 'en-US', rate = 1.0) => {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang;
                utterance.rate = rate;
                window.speechSynthesis.speak(utterance);
            };
            return { speak };
        };

        const Button = ({ children, onClick, className, variant = 'primary', disabled = false }) => {
            const variants = {
                primary: "bg-blue-600 hover:bg-blue-700 text-white shadow-md",
                secondary: "bg-gray-200 hover:bg-gray-300 text-gray-800",
                success: "bg-green-500 hover:bg-green-600 text-white",
                danger: "bg-red-500 hover:bg-red-600 text-white",
                outline: "border-2 border-blue-600 text-blue-600 hover:bg-blue-50"
            };
            return (
                <button onClick={onClick} disabled={disabled}
                    className={`px-4 py-2 rounded-xl font-bold transition-all transform active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed ${variants[variant]} ${className}`}>
                    {children}
                </button>
            );
        };

                return (
                    <div className="flex justify-center my-4">
                        <span className="bg-gray-200 text-gray-600 text-xs px-3 py-1 rounded-full shadow-sm">{text}</span>
                    </div>
                );
            }

            if (isContextHint) {
                return (
                    <div className="flex flex-col items-center mb-4 fade-in-up w-full opacity-90">
                         <div className="text-xs text-blue-500 font-bold mb-1 tracking-wider uppercase flex items-center">
                            <i className="fas fa-info-circle mr-1"></i> Next Sentence Hint
                         </div>
                         <div className="max-w-[85%] border-2 border-dashed border-blue-300 bg-blue-50 px-4 py-2 rounded-xl text-gray-700 text-sm text-center relative shadow-sm">
                            <span className="font-bold mr-1 text-blue-800">{speaker}:</span> {text}
                            {isPracticeMode && translationText && (
                                <div className="mt-1 pt-1 border-t border-blue-200 text-xs text-gray-500">
                                    {translationText}
                                </div>
                            )}
                         </div>
                    </div>
                );
            }

            return (
                <div className={`flex flex-col ${isUser ? 'items-end' : 'items-start'} mb-4 fade-in-up group`}>
                    <div className="flex items-center mb-1">
                        <span className="text-xs text-gray-500 mx-2 font-semibold">{speaker}</span>
                    </div>
                    <div className={`flex items-end ${isUser ? 'flex-row-reverse' : 'flex-row'}`}>
                        {/* Bubble */}
                        <div className={`max-w-[80%] px-4 py-3 rounded-2xl shadow-sm text-md leading-relaxed ${
                            isUser 
                                ? 'bg-blue-600 text-white rounded-tr-none' 
                                : 'bg-white text-gray-800 border border-gray-100 rounded-tl-none'
                        }`}>
                            <div>{text}</div>
                            {isPracticeMode && showChinese && translationText && (
                                <div className={`mt-2 pt-2 border-t text-xs ${isUser ? 'border-blue-400 text-blue-100' : 'border-gray-200 text-gray-500'}`}>
                                    {translationText}
                                </div>
                            )}
                        </div>

                        {/* Controls */}
                        <div className={`flex items-center ${isUser ? 'mr-2 space-x-1' : 'ml-2 space-x-1'}`}>
                            <button onClick={() => onPlayAudio(text)}
                                className={`w-8 h-8 rounded-full flex items-center justify-center transition-colors speaker-btn ${
                                    isUser 
                                        ? 'bg-blue-100 text-blue-600 hover:bg-blue-200' 
                                        : 'bg-gray-100 text-gray-500 hover:bg-blue-100 hover:text-blue-600'
                                }`}
                                title="Listen">
                                <i className="fas fa-volume-up text-xs"></i>
                            </button>
                            {isPracticeMode && translationText && (
                                <button onClick={() => setShowChinese(!showChinese)}
                                    className={`w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold transition-colors ${
                                        showChinese 
                                            ? 'bg-yellow-400 text-yellow-900 shadow-sm' 
                                            : 'bg-gray-100 text-gray-400 hover:bg-gray-200 hover:text-gray-600'
                                    }`}
                                    title="Toggle Translation">
                                    中
                                </button>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const ReviewCard = ({ question }) => {
            const [showTranslation, setShowTranslation] = useState(false);
            return (
                <div className="bg-white p-4 rounded-xl border border-red-100 shadow-sm mb-4">
                    <div className="flex justify-between items-start mb-2">
                        <span className="bg-red-100 text-red-600 text-xs px-2 py-1 rounded font-bold">Q{question.id} ({question.year})</span>
                        <button onClick={() => setShowTranslation(!showTranslation)} className="text-xs text-blue-500 font-bold hover:underline">
                            {showTranslation ? 'Hide Translation' : 'Show Translation'}
                        </button>
                    </div>
                    <div className="space-y-2 mb-4 bg-gray-50 p-3 rounded-lg text-sm">
                        {question.dialogue.map((line, i) => (
                            <div key={i} className="mb-2 border-b border-gray-200 pb-2 last:border-0 last:pb-0">
                                <p className="font-semibold text-gray-700"><span className="text-gray-400 mr-2">{question.speakers[line.speaker]}:</span>{line.text}</p>
                                {showTranslation && <p className="text-gray-500 mt-1 text-xs pl-8">{question.translation.dialogue[i]}</p>}
                            </div>
                        ))}
                        {question.postDialogue && (
                            <div className="mt-2 pt-2 border-t border-blue-200 bg-blue-50 p-2 rounded">
                                <p className="font-semibold text-gray-700"><span className="text-gray-400 mr-2">{question.speakers[question.postDialogue.speaker]}:</span>{question.postDialogue.text}</p>
                                {showTranslation && <p className="text-gray-500 mt-1 text-xs pl-8">{question.translation.postDialogue}</p>}
                            </div>
                        )}
                    </div>
                    <div className="text-sm">
                        <p className="font-bold text-gray-700 mb-2">Options:</p>
                        {question.options.map((opt) => {
                            const isCorrect = opt.id === question.correctAnswer;
                            return (
                                <div key={opt.id} className={`p-2 rounded mb-1 ${isCorrect ? 'bg-green-100 border border-green-200' : 'opacity-60'}`}>
                                    <div className="flex items-center">
                                        <span className={`w-5 h-5 flex items-center justify-center rounded-full text-xs mr-2 font-bold ${isCorrect ? 'bg-green-500 text-white' : 'bg-gray-200'}`}>{opt.id}</span>
                                        <span className={isCorrect ? 'text-green-800 font-semibold' : ''}>{opt.text}</span>
                                        {isCorrect && <i className="fas fa-check ml-auto text-green-600"></i>}
                                    </div>
                                    {showTranslation && <p className="text-xs text-gray-500 mt-1 pl-7">{question.translation.options[opt.id]}</p>}
                                </div>
                            )
                        })}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [studentName, setStudentName] = useState('');
            const [mode, setMode] = useState('practice'); // 'practice' | 'exam'
            const [gameState, setGameState] = useState('welcome');
            const [currentQIndex, setCurrentQIndex] = useState(0);
            const [chatHistory, setChatHistory] = useState([]);
            const [currentOptions, setCurrentOptions] = useState([]);
            const [score, setScore] = useState(0);
            const [hearts, setHearts] = useState(3);
            const [feedback, setFeedback] = useState(null);
            const [isTyping, setIsTyping] = useState(false);
            const [showHints, setShowHints] = useState(false);
            const [isOptionsMinimized, setIsOptionsMinimized] = useState(false);
            const [wrongQuestionIds, setWrongQuestionIds] = useState([]);
            
            const { speak } = useTTS();
            const bottomRef = useRef(null);
            const currentQuestion = EXAM_DATA[currentQIndex];

            useEffect(() => {
                const timeoutId = setTimeout(() => { bottomRef.current?.scrollIntoView({ behavior: 'smooth' }); }, 100);
                return () => clearTimeout(timeoutId);
            }, [chatHistory, isTyping, feedback, currentOptions, isOptionsMinimized]);

            useEffect(() => {
                if (currentOptions.length > 0) setIsOptionsMinimized(false);
            }, [currentOptions]);

            const startGame = () => {
                if (!studentName.trim()) { alert("Please enter your name first!"); return; }
                setGameState('playing');
                setScore(0);
                setHearts(3);
                setCurrentQIndex(0);
                setWrongQuestionIds([]);
                loadQuestion(0);
                speak("", 'en-US'); 
            };

            const loadQuestion = async (index) => {
                const q = EXAM_DATA[index];
                const userRole = q.userSpeaker || "A";

                setChatHistory([{ type: 'system', text: `Question ${index + 1} / ${EXAM_DATA.length}` }]);
                setFeedback(null);
                setCurrentOptions([]);
                setShowHints(false);

                // 1. Dialogue stream
                for (let i = 0; i < q.dialogue.length; i++) {
                    const line = q.dialogue[i];
                    const isUserLine = (line.speaker === userRole);

                    setIsTyping(true);
                    await new Promise(r => setTimeout(r, 250 + line.text.length * 8)); 
                    setIsTyping(false);

                    setChatHistory(prev => [...prev, { 
                        ...line, 
                        translationText: q.translation.dialogue[i],
                        isUser: isUserLine 
                    }]);
                }

                // 2. Post-Dialogue Hint
                if (q.postDialogue) {
                    await new Promise(r => setTimeout(r, 200));
                    const isUserPost = (q.postDialogue.speaker === userRole);
                    setChatHistory(prev => [...prev, { 
                        ...q.postDialogue, 
                        translationText: q.translation.postDialogue,
                        isUser: isUserPost, 
                        isContextHint: true 
                    }]);
                }

                await new Promise(r => setTimeout(r, 250));
                setCurrentOptions(q.options);
            };

            const handleAnswer = (optionId) => {
                const q = currentQuestion;
                const selectedOption = q.options.find(o => o.id === optionId);
                const isCorrect = optionId === q.correctAnswer;

                setChatHistory(prev => [...prev, { 
                    speaker: q.speakers[q.userSpeaker || "A"], 
                    text: selectedOption.text, 
                    translationText: q.translation.options[optionId],
                    isUser: true 
                }]);

                if (mode === 'practice') {
                    if (isCorrect) {
                        speak(selectedOption.text); 
                        setScore(s => s + 10);
                        setFeedback({ type: 'success', msg: 'Correct! ✅', explanation: q.explanation, roast: q.roast });
                    } else {
                        setHearts(h => h - 1);
                        setWrongQuestionIds(prev => { if (!prev.includes(q.uid)) return [...prev, q.uid]; return prev; });
                        setFeedback({ type: 'error', msg: 'Oops! ❌', explanation: '這回答在語境上有點怪怪的喔，再試試看！', roast: '對方已讀不回...' });
                    }
                } else {
                    if (isCorrect) {
                        setScore(s => s + 10);
                    } else {
                        setWrongQuestionIds(prev => [...prev, q.uid]);
                    }
                    setTimeout(() => {
                        nextQuestionSilently();
                    }, 400);
                }

                setCurrentOptions([]);
            };

            const nextQuestionSilently = () => {
                if (currentQIndex < EXAM_DATA.length - 1) {
                    setCurrentQIndex(prev => prev + 1);
                    loadQuestion(currentQIndex + 1);
                } else {
                    setGameState('result');
                }
            };

            const nextQuestion = () => {
                if (currentQIndex < EXAM_DATA.length - 1) {
                    if (hearts === 0) setHearts(3);
                    setCurrentQIndex(prev => prev + 1);
                    loadQuestion(currentQIndex + 1);
                } else {
                    setGameState('result');
                }
            };

            // Welcome Screen
            if (gameState === 'welcome') {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-6 bg-gradient-to-br from-indigo-600 via-blue-600 to-purple-600 text-white">
                        <div className="bg-white/10 backdrop-blur-md p-8 rounded-3xl shadow-2xl text-center max-w-md w-full border border-white/20">
                            <i className="fas fa-comments text-6xl mb-4 text-yellow-300 animate-bounce"></i>
                            <h1 className="text-4xl font-black mb-1 tracking-tight">Chat Master</h1>
                            <p className="text-lg opacity-90 mb-6 font-light">115 統測英語對話攻略戰</p>
                            
                            <div className="mb-6 bg-white/20 p-1.5 rounded-2xl flex border border-white/30">
                                <button 
                                    onClick={() => setMode('practice')}
                                    className={`flex-1 py-2.5 rounded-xl font-bold transition-all text-sm ${
                                        mode === 'practice' ? 'bg-yellow-400 text-blue-900 shadow-md' : 'text-white opacity-80 hover:opacity-100'
                                    }`}>
                                    <i className="fas fa-graduation-cap mr-1"></i> 練習模式
                                </button>
                                <button 
                                    onClick={() => setMode('exam')}
                                    className={`flex-1 py-2.5 rounded-xl font-bold transition-all text-sm ${
                                        mode === 'exam' ? 'bg-red-500 text-white shadow-md' : 'text-white opacity-80 hover:opacity-100'
                                    }`}>
                                    <i className="fas fa-stopwatch mr-1"></i> 正式測驗
                                </button>
                            </div>

                            <div className="mb-6">
                                <label className="block text-left text-sm font-bold mb-2 ml-1">Student Name</label>
                                <input type="text" value={studentName} onChange={(e) => setStudentName(e.target.value)}
                                    placeholder="請輸入名字..."
                                    className="w-full px-4 py-3 rounded-xl bg-white/20 border border-white/30 text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-yellow-400 text-center text-lg"/>
                            </div>
                            
                            <Button onClick={startGame} className="w-full text-lg py-4 bg-yellow-400 hover:bg-yellow-300 text-blue-900 shadow-xl transform transition hover:scale-105">
                                {mode === 'practice' ? '開始練習' : '進入測驗'} <i className="fas fa-play ml-2"></i>
                            </Button>
                        </div>
                    </div>
                );
            }

            // Results Screen
            if (gameState === 'result') {
                const wrongQuestions = EXAM_DATA.filter(q => wrongQuestionIds.includes(q.uid));
                return (
                    <div className="min-h-screen flex flex-col items-center p-6 bg-white text-gray-800">
                        <div className="max-w-md w-full text-center">
                            <h2 className="text-3xl font-bold mb-1 text-blue-600">
                                {mode === 'practice' ? 'Practice Finished!' : 'Exam Completed!'}
                            </h2>
                            <p className="text-xl font-medium mb-6 text-gray-600">Hi, {studentName}!</p>
                            <div className="text-6xl font-black mb-2 text-yellow-500">{score}</div>
                            <p className="text-gray-500 mb-8">Total Score</p>
                            
                            <div className="grid grid-cols-2 gap-4 mb-8">
                                <div className="bg-gray-100 p-4 rounded-2xl">
                                    <div className="text-2xl font-bold text-gray-700">{Math.round((score / (EXAM_DATA.length * 10)) * 100)}%</div>
                                    <div className="text-xs text-gray-500">Accuracy</div>
                                </div>
                                <div className="bg-gray-100 p-4 rounded-2xl">
                                    <div className="text-2xl font-bold text-gray-700">{wrongQuestions.length}</div>
                                    <div className="text-xs text-gray-500">Mistakes</div>
                                </div>
                            </div>
                            
                            {wrongQuestions.length > 0 && (
                                <div className="mb-8 text-left">
                                    <h3 className="text-lg font-bold text-gray-800 mb-4 border-l-4 border-red-500 pl-3">Mistake Review ({wrongQuestions.length})</h3>
                                    {wrongQuestions.map((q) => <ReviewCard key={q.uid} question={q} />)}
                                </div>
                            )}
                            {wrongQuestions.length === 0 && (
                                <div className="mb-8 p-6 bg-green-50 rounded-xl text-green-700 font-bold border border-green-200">Perfect Score! 🎉</div>
                            )}
                            <Button onClick={() => window.location.reload()} className="w-full">Play Again <i className="fas fa-redo ml-2"></i></Button>
                        </div>
                    </div>
                );
            }

            // Chat View
            const otherSpeakerRole = currentQuestion.userSpeaker === "B" ? "A" : "B";
            const partnerName = currentQuestion.speakers[otherSpeakerRole];

            return (
                <div className="h-screen flex flex-col max-w-md mx-auto bg-white shadow-2xl overflow-hidden relative">
                    <header className="bg-white/90 backdrop-blur-sm p-4 border-b flex justify-between items-center sticky top-0 z-10 shadow-sm shrink-0">
                        <div className="flex items-center">
                            <div className="w-10 h-10 rounded-full bg-gradient-to-tr from-blue-400 to-blue-600 flex items-center justify-center text-white font-bold mr-3 shadow-md">
                                {partnerName ? partnerName.charAt(0) : 'C'}
                            </div>
                            <div>
                                <h2 className="font-bold text-gray-800">{partnerName}</h2>
                                <p className="text-xs text-green-500 flex items-center"><span className="w-2 h-2 bg-green-500 rounded-full mr-1 animate-pulse"></span> Online</p>
                            </div>
                        </div>
                        <div className="flex space-x-2 items-center">
                            <span className={`text-xs px-2 py-1 rounded font-bold ${mode === 'practice' ? 'bg-yellow-100 text-yellow-800' : 'bg-red-100 text-red-700'}`}>
                                {mode === 'practice' ? '練習模式' : '正式測驗'}
                            </span>
                            {mode === 'practice' && (
                                <div className="flex items-center bg-red-50 px-2 py-1 rounded-lg">
                                    <i className="fas fa-heart text-red-500 mr-1 animate-pulse"></i>
                                    <span className="font-bold text-red-600">{hearts}</span>
                                </div>
                            )}
                            <div className="flex items-center bg-yellow-50 px-2 py-1 rounded-lg">
                                <i className="fas fa-star text-yellow-500 mr-1"></i>
                                <span className="font-bold text-yellow-600">{score}</span>
                            </div>
                        </div>
                    </header>

                    <div className="flex-1 overflow-y-auto p-4 bg-gray-50 scrollbar-hide pb-20">
                        <div className="text-center text-xs text-gray-400 mb-4 my-2">
                            {currentQuestion.year}年 統測對話題 - Q{currentQuestion.id} {currentQuestion.title}<br/>
                            <span className="italic">{currentQuestion.scenario}</span>
                        </div>
                        {chatHistory.map((msg, idx) => (
                            <ChatBubble 
                                key={idx} 
                                text={msg.text} 
                                translationText={msg.translationText}
                                speaker={msg.isUser ? "You" : (currentQuestion.speakers[msg.speaker] || msg.speaker)} 
                                isUser={msg.isUser} 
                                isSystem={msg.type === 'system'} 
                                onPlayAudio={speak} 
                                isContextHint={msg.isContextHint}
                                isPracticeMode={mode === 'practice'}
                            />
                        ))}
                        {isTyping && (
                            <div className="flex items-center space-x-1 ml-2 mb-4 bg-gray-200 w-16 px-3 py-3 rounded-2xl rounded-tl-none">
                                <div className="w-2 h-2 bg-gray-500 rounded-full typing-dot"></div>
                                <div className="w-2 h-2 bg-gray-500 rounded-full typing-dot"></div>
                                <div className="w-2 h-2 bg-gray-500 rounded-full typing-dot"></div>
                            </div>
                        )}
                        <div ref={bottomRef}></div>
                    </div>

                    {/* Feedback area */}
                    {mode === 'practice' && feedback && (
                        <div className={`p-4 ${feedback.type === 'success' ? 'bg-green-50' : 'bg-red-50'} border-t animate-in fade-in slide-in-from-bottom-4`}>
                            <div className="flex items-start mb-2">
                                <div className={`text-2xl mr-3 ${feedback.type === 'success' ? 'text-green-500' : 'text-red-500'}`}>
                                    <i className={`fas ${feedback.type === 'success' ? 'fa-check-circle' : 'fa-times-circle'}`}></i>
                                </div>
                                <div>
                                    <h3 className={`font-bold ${feedback.type === 'success' ? 'text-green-800' : 'text-red-800'}`}>{feedback.msg}</h3>
                                    <p className="text-sm text-gray-600 mt-1">{feedback.explanation}</p>
                                </div>
                            </div>
                            {feedback.roast && (
                                <div className="mt-2 bg-white/50 p-2 rounded-lg border-l-4 border-purple-500">
                                    <p className="text-xs text-purple-800 italic"><i className="fas fa-comment-dots mr-1"></i> {feedback.roast}</p>
                                </div>
                            )}
                            <Button onClick={nextQuestion} className="w-full mt-3 shadow-none">
                                {currentQIndex < EXAM_DATA.length - 1 ? 'Next Topic' : 'Finish'} <i className="fas fa-arrow-right ml-1"></i>
                            </Button>
                        </div>
                    )}

                    {/* Options selection */}
                    {!feedback && currentOptions.length > 0 && (
                        <div className={`transition-all duration-300 ease-in-out bg-white border-t rounded-t-3xl shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] z-20 ${isOptionsMinimized ? 'h-16 overflow-hidden' : 'h-auto'}`}>
                            <div className="flex justify-between items-center px-4 py-3 border-b bg-gray-50/50 cursor-pointer" onClick={() => setIsOptionsMinimized(!isOptionsMinimized)}>
                                <span className="text-xs text-gray-400 font-bold tracking-wider">YOUR REPLY {isOptionsMinimized && "(Tap to open)"}</span>
                                <div className="flex items-center space-x-3">
                                    {mode === 'practice' && !isOptionsMinimized && (
                                        <button onClick={(e) => { e.stopPropagation(); setShowHints(!showHints); }} className="text-xs flex items-center text-blue-500 hover:text-blue-700 font-semibold px-2 py-1 rounded hover:bg-blue-50">
                                            <i className="far fa-lightbulb mr-1"></i> {showHints ? 'Hide Hints' : 'Need Hints?'}
                                        </button>
                                    )}
                                    <button className="text-gray-400 hover:text-gray-600 transition-colors">
                                        <i className={`fas ${isOptionsMinimized ? 'fa-chevron-up' : 'fa-chevron-down'}`}></i>
                                    </button>
                                </div>
                            </div>
                            {!isOptionsMinimized && (
                                <div className="p-4">
                                    {mode === 'practice' && showHints && (
                                        <div className="mb-3 p-3 bg-yellow-50 rounded-xl border border-yellow-100 text-sm text-yellow-800 slide-in-from-bottom-2 animate-in">
                                            <div className="font-bold mb-1 text-xs uppercase text-yellow-600">Keywords:</div>
                                            <div className="flex flex-wrap gap-1">
                                                {currentQuestion.vocab.map((v, i) => (
                                                    <span key={i} className="bg-white px-2 py-0.5 rounded border border-yellow-200 text-xs">{v}</span>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                    <div className="grid grid-cols-1 gap-2 max-h-60 overflow-y-auto">
                                        {currentOptions.map((opt) => (
                                            <button key={opt.id} onClick={() => handleAnswer(opt.id)} className="w-full text-left px-4 py-3 rounded-xl border-2 border-gray-100 hover:border-blue-500 hover:bg-blue-50 transition-all group flex items-center">
                                                <span className="w-6 h-6 rounded-full bg-gray-200 text-gray-500 flex items-center justify-center text-xs font-bold mr-3 group-hover:bg-blue-500 group-hover:text-white transition-colors shrink-0">{opt.id}</span>
                                                <span className="text-gray-700 font-medium text-sm group-hover:text-blue-700">{opt.text}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
